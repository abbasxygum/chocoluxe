<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Sign In — Chocoluxe by Iram</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Pictures/favicon-32x32.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
    <main class="admin-login">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-mark">CX</span>
                <h1>Chocoluxe <small>by Iram</small></h1>
                <p>Admin sign in to manage your orders</p>
            </div>
            <form id="admin-login-form" novalidate>
                <div class="field">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" required autocomplete="username" placeholder="admin@chocoluxe.com">
                </div>
                <div class="field">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <p class="login-error" id="login-error" hidden></p>
                <button type="submit" class="btn btn-gold btn-block" id="login-btn">Sign In</button>
                <p class="login-foot">
                    <a href="index.html">&#8592; Back to store</a>
                </p>
            </form>
        </div>
    </main>

    <script>
        (function () {
            'use strict';
            var API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? window.location.origin + '/api' : '/api';
            var TOKEN_KEY = 'chx_admin_token';

            document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                var email = document.getElementById('admin-email').value.trim();
                var password = document.getElementById('admin-password').value;
                var errEl = document.getElementById('login-error');
                var btn = document.getElementById('login-btn');
                errEl.hidden = true;
                btn.disabled = true;
                btn.textContent = 'Signing in…';

                try {
                    var res = await fetch(API + '/auth/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    });
                    var data = await res.json().catch(function () { return {}; });
                    if (!res.ok) throw new Error(data.error || 'Invalid email or password');
                    if (!data.user || data.user.role !== 'admin') throw new Error('Admin access required');

                    localStorage.setItem(TOKEN_KEY, data.token);
                    localStorage.setItem('chx_admin_user', JSON.stringify({ name: data.user.name, email: data.user.email }));
                    window.location.href = 'admin.html';
                } catch (err) {
                    errEl.textContent = err.message || 'Login failed';
                    errEl.hidden = false;
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
